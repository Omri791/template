<div class="auth-page"><div class="auth-card card"><div class="auth-logo">♥</div><h1>Bienvenue</h1><p>Connectez-vous à votre espace BloodCare.</p>@if(error){<div class="error">{{error}}</div>}<form (ngSubmit)="submit()"><div class="form-group"><label>Email</label><input type="email" [(ngModel)]="email" name="email" required placeholder="vous@email.com"></div><div class="form-group"><label>Mot de passe</label><input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••"></div><div class="form-group"><label>Type de compte</label><select [(ngModel)]="role" name="role"><option value="DONOR">Donneur</option><option value="HOSPITAL">Hôpital</option><option value="CENTER">Centre de don</option><option value="ADMIN">Administrateur</option></select></div><button class="btn btn-primary full" type="submit">Se connecter</button></form><p class="bottom">Pas encore de compte ? <a routerLink="/signup">Créer un compte</a></p></div></div>
