<div class="container page">@if(donation){<div class="card" style="max-width:700px;margin:auto"><a routerLink="/donations">← Retour</a><h1>Détail du don #{{donation.id}}</h1><p><strong>Donneur :</strong> {{donation.donorName}}</p><p><strong>Groupe :</strong> {{donation.bloodType}}</p><p><strong>Centre :</strong> {{donation.centerName}}</p><p><strong>Date :</strong> {{donation.date}}</p><p><strong>Quantité :</strong> {{donation.quantity}} ml</p><p><strong>Statut :</strong> {{donation.status}}</p></div>}@else{<div class="empty">Don introuvable.</div>}</div>
