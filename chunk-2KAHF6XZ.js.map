<div class="auth-page"><div class="auth-card card"><div class="auth-logo">♥</div><h1>Créer un compte</h1><p>Choisissez votre rôle sur la plateforme.</p><form (ngSubmit)="submit()"><div class="form-grid"><div class="form-group"><label>Prénom</label><input [(ngModel)]="firstName" name="firstName" required></div><div class="form-group"><label>Nom</label><input [(ngModel)]="lastName" name="lastName" required></div></div><div class="form-group"><label>Email</label><input type="email" [(ngModel)]="email" name="email" required></div><div class="form-group"><label>Mot de passe</label><input type="password" [(ngModel)]="password" name="password" required></div><div class="form-group"><label>Type de compte</label><select [(ngModel)]="role" name="role"><option value="DONOR">Donneur</option><option value="HOSPITAL">Hôpital</option><option value="CENTER">Centre de don</option></select></div><button class="btn btn-primary full">Créer mon compte</button></form><p class="bottom">Déjà inscrit ? <a routerLink="/login">Se connecter</a></p></div></div>
